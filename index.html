<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07070a">
    <title>LPB MUSIC 🧡 | Next-Gen Audio</title>

    <!-- Google Fonts: Plus Jakarta Sans & Space Grotesk para toque futurista -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --naranja: #ff6b00;
            --naranja-neon: #ff8c00;
            --dorado: #ffc15e;
            --magenta-sutil: rgba(255, 42, 109, 0.14);
            --naranja-glow: rgba(255, 107, 0, 0.4);
            --fondo: #07070a;
            --panel: rgba(18, 18, 26, 0.72);
            --panel-solid: #12121a;
            --blanco: #f8f9fa;
            --gris: #8e92a4;
            --borde: rgba(255, 255, 255, 0.08);
            --borde-neon: rgba(255, 140, 0, 0.45);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding-bottom: 165px;
            background-color: var(--fondo);
            /* Fondo futurista con malla sutil y luces ambientales */
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(255, 107, 0, 0.22) 0%, transparent 55%),
                radial-gradient(circle at 90% 40%, var(--magenta-sutil) 0%, transparent 45%),
                radial-gradient(circle at 10% 80%, rgba(255, 140, 0, 0.08) 0%, transparent 45%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: var(--blanco);
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            overflow-x: hidden;
        }

        button, input, select { font: inherit; }

        /* BOTONES FUTURISTAS */
        .btn-primary {
            background: linear-gradient(135deg, var(--naranja), var(--naranja-neon), var(--dorado));
            background-size: 200% 200%;
            color: #07070a;
            border: none;
            padding: 11px 22px;
            border-radius: 99px;
            cursor: pointer;
            font-weight: 800;
            letter-spacing: 0.3px;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.35), inset 0 1px 1px rgba(255,255,255,0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 28px rgba(255, 107, 0, 0.6);
            background-position: 100% 0;
        }

        .btn-primary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            color: var(--blanco);
            border: 1px solid var(--borde);
            padding: 10px 20px;
            border-radius: 99px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .btn-glass:hover {
            background: rgba(255, 107, 0, 0.14);
            border-color: var(--borde-neon);
            color: var(--dorado);
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.2);
        }

        /* INPUTS & SELECTS */
        input, select {
            width: 100%;
            background: rgba(12, 12, 18, 0.85);
            border: 1px solid var(--borde);
            border-radius: 14px;
            padding: 13px 16px;
            color: var(--blanco);
            outline: none;
            margin-top: 6px;
            margin-bottom: 16px;
            transition: all 0.25s ease;
        }

        input:focus, select:focus {
            border-color: var(--naranja-neon);
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.18), 0 0 20px rgba(255, 107, 0, 0.2);
            background: rgba(18, 18, 26, 0.95);
        }

        input[type="file"] {
            padding: 10px;
            font-size: 13px;
            color: var(--gris);
        }

        input[type="file"]::file-selector-button {
            background: rgba(255, 107, 0, 0.18);
            color: var(--dorado);
            border: 1px solid var(--borde-neon);
            padding: 6px 14px;
            border-radius: 8px;
            margin-right: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: var(--naranja);
            color: #07070a;
        }

        /* HEADER FUTURISTA */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 32px 20px 18px;
            max-width: 960px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: rgba(18, 18, 26, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid var(--borde);
            padding: 12px 22px;
            border-radius: 99px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 20%, var(--naranja-neon) 60%, var(--dorado) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge-version {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255, 107, 0, 0.15);
            color: var(--dorado);
            border: 1px solid rgba(255, 107, 0, 0.35);
        }

        /* BUSCADOR RÁPIDO CENTRAL CON GLOW */
        .search-wrapper {
            width: 100%;
            max-width: 580px;
            position: relative;
        }

        .search-wrapper input {
            margin: 0;
            border-radius: 99px;
            padding: 15px 46px 15px 50px;
            background: rgba(18, 18, 26, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
            font-size: 15px;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--naranja-neon);
            font-size: 16px;
        }

        .clear-search {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--blanco);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* PÍLDORAS DE GÉNEROS */
        .genre-pills {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 6px 4px;
            max-width: 100%;
            scrollbar-width: none;
        }
        .genre-pills::-webkit-scrollbar { display: none; }

        .pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--borde);
            color: var(--gris);
            padding: 9px 18px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .pill:hover {
            background: rgba(255, 107, 0, 0.12);
            color: var(--blanco);
            border-color: var(--borde-neon);
        }

        .pill.active {
            background: linear-gradient(135deg, var(--naranja), var(--dorado));
            color: #07070a;
            font-weight: 800;
            border-color: transparent;
            box-shadow: 0 0 18px var(--naranja-glow);
        }

        .app {
            max-width: 1160px;
            margin: auto;
            padding: 10px 24px;
        }

        /* TARJETAS DE PANELES (LOGIN / UPLOAD) */
        .glass-panel {
            background: var(--panel);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--borde-neon);
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--naranja), var(--dorado), transparent);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* CABECERA DE SECCIÓN */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0 22px;
        }

        .section-header h2 {
            margin: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .counter-badge {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--borde);
            padding: 5px 14px;
            border-radius: 99px;
            color: var(--dorado);
            font-size: 12px;
            font-weight: 700;
        }

        /* GRID DE CANCIONES FUTURISTA */
        .song-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
            gap: 22px;
        }

        .song-card {
            background: rgba(20, 20, 29, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid var(--borde);
            padding: 14px;
            border-radius: 22px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .song-card:hover {
            border-color: var(--borde-neon);
            transform: translateY(-8px);
            background: rgba(28, 28, 40, 0.9);
            box-shadow: 0 18px 38px rgba(0, 0, 0, 0.7), 0 0 22px rgba(255, 107, 0, 0.18);
        }

        .song-card.playing-card {
            border-color: var(--naranja-neon);
            box-shadow: 0 0 25px rgba(255, 107, 0, 0.25);
        }

        .cover-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 14px;
            background: #14141d;
        }

        .cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .song-card:hover .cover-container img {
            transform: scale(1.06);
        }

        /* BOTÓN DE PLAY FLOTANTE EN LA PORTADA */
        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(7, 7, 10, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .song-card:hover .play-overlay,
        .song-card.playing-card .play-overlay {
            opacity: 1;
        }

        .play-circle-hover {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--naranja), var(--dorado));
            color: #07070a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 0 20px var(--naranja-glow);
            transform: scale(0.9);
            transition: transform 0.25s ease;
        }

        .song-card:hover .play-circle-hover {
            transform: scale(1);
        }

        .genre-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2;
            background: rgba(7, 7, 10, 0.78);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 140, 0, 0.4);
            color: var(--dorado);
            font-size: 10px;
